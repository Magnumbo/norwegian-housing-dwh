version: 2

models:
  - name: int_kommune_korrespondanse
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - start_code
              - current_code
    columns:
      - name: start_code
        tests:
          - not_null
      - name: current_code
        tests:
          - not_null
  - name: int_kommune_area
    columns:
      - name: area_code
        tests:
          - not_null
      - name: current_code
        tests:
          - not_null
          - unique
      - name: area_name
        tests:
          - not_null

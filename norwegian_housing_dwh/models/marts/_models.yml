version: 2

models:
  - name: dim_geography
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - code
              - valid_from
    columns:
      - name: geography_key
        tests:
          - not_null
          - unique
      - name: code
        tests:
          - not_null
      - name: valid_from
        tests:
          - not_null
      - name: area_code
        tests:
          - not_null
  - name: fct_dwellings
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - geography_key
              - building_type_code
              - year
    columns:
      - name: geography_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_geography')
                field: geography_key
      - name: building_type_code
        tests:
          - not_null
      - name: year
        tests:
          - not_null
      - name: dwellings
        tests:
          - not_null
  - name: dwellings_naive_vs_harmonised
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - current_code
              - year
    columns:
      - name: current_code
        tests:
          - not_null
      - name: year
        tests:
          - not_null
      - name: harmonised_dwellings
        tests:
          - not_null
      - name: naive_dwellings
        description: >
          Dwellings for current_code itself only. NULL in years before the code
          existed.

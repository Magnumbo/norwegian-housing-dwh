resources:
  jobs:
    nor_housing_pipeline:
      name: nor_housing_pipeline
      tasks:
        - task_key: ingest
          notebook_task:
            notebook_path: notebooks/ingest
            source: GIT
          max_retries: 2
          min_retry_interval_millis: 60000
          disable_auto_optimization: false
          environment_key: Default
        - task_key: load_bronze
          depends_on:
            - task_key: ingest
          notebook_task:
            notebook_path: notebooks/load_bronze
            source: GIT
          environment_key: Default
        - task_key: dbt_build
          depends_on:
            - task_key: load_bronze
          dbt_task:
            project_directory: norwegian_housing_dwh
            commands:
              - dbt deps
              - dbt build
            schema: silver
            warehouse_id: f207f94efa4f562c
            catalog: nor_housing
            source: GIT
          environment_key: dbt-default
      git_source:
        git_url: https://github.com/Magnumbo/norwegian-housing-dwh
        git_provider: gitHub
        git_branch: main
      queue:
        enabled: true
      environments:
        - environment_key: Default
          spec:
            environment_version: "6"
        - environment_key: dbt-default
          spec:
            dependencies:
              - dbt-databricks==1.12.4
            environment_version: "6"
      performance_target: PERFORMANCE_OPTIMIZED
